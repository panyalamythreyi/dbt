version: 2

models:
  - name: dim_listings_cleansed
    description: "Cleansed dimension table for listings"
    data_tests:
      - min_row_count_check:
          min_row_count: 1000
          config:
            severity: WARN

    columns:
      - name: listing_id
        description: "Unique identifier for the listing"
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: "Unique identifier for the host"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id

      - name: room_type
        description: "Type of room for the listing"
        data_tests:
          - accepted_values:
              values: [
                'Entire home/apt',
                'Private room',
                'Shared room',
                'Hotel room'
              ]

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: "Cleansed dimension table for hosts"
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Unique identifier for the host"
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique

      - name: host_name
        description: "Name of the host"
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        description: "Indicates if the host is a superhost"
        data_type: string
        data_tests:
          - accepted_values:
              values: ['t', 'f']

      - name: updated_at
        description: "Timestamp when the host information was last updated"
        data_type: timestamp

      - name: created_at
        description: "Timestamp when the host was created"
        data_type: timestamp

  - name: dim_listings_with_hosts
    description: "Listings enriched with host data"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')

    columns:
      - name: price
        description: "Nightly price of the listing"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: 0.99
              min_value: 50
              max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
               max_value: 5000 # (Optional)
               config:
                 severity: WARN