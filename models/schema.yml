models:
  - name: dim_listings_cleansed
    description: "Cleansed dimension table for listings"
    data_tests:
      - min_row_count_check:
          arguments:
            min_row_count: 1000
          severity: WARN #takes priority over the default severity of the test
    columns:
      - name: listing_id
        description: "Unique identifier for the listing"
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: "Unique identifier for the host"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "Type of room for the listing"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed   #contract is to check schema and its columns with data type match with db, if not match then it will throw error
    description: "Cleansed dimension table for hosts"
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Unique identifier for the host"
        data_type: integer
        constraints:   #testing will be performed during data insert time by dbt run command
          - type: not_null
        data_tests:  #executed during dbt test command
          - unique
         
          

      - name: host_name
        description: "Name of the host"
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        description: "Indicates if the host is a superhost"
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        description: "Timestamp when the host information was last updated"
        data_type: timestamp
          

      - name: created_at
        description: "Timestamp when the host was created"
        data_type: timestamp
        
          