models:
  - name: dim_listings_cleansed
    data_tests:
      - min_row_count_check:
          arguments:
            min_row_count: 1000
          severity: WARN #takes priority over the default severity of the test
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']

      - name: minimum_nights
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed   #contract is to check schema and its columns with data type match with db, if not match then it will throw error
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
        constraints:   #testing will be performed during data insert time 
          - type: not_null
        data_tests:
          - unique
          

      - name: host_name
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        data_type: timestamp
          

      - name: created_at
        data_type: timestamp
        
          